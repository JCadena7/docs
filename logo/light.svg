<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    <defs>
        <filter id="neon-outer" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur1"/>
                <feMergeNode in="blur2"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="neon-inner" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glow-node" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glow-small" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <!-- Gradiente para el relleno de letras (efecto cristal azul) -->
        <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1a5c8a"/>
            <stop offset="50%" stop-color="#0a2f50"/>
            <stop offset="100%" stop-color="#061e33"/>
        </linearGradient>
    </defs>

    <!-- === CAPA 1: Resplandor exterior (glow difuso cian) === -->
    <g filter="url(#neon-outer)" opacity="0.6">
        <g stroke="#00d4f5" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="
                M 310 245 A 42 42 0 1 0 310 297 L 310 271 L 278 271
                M 310 271 L 362 271
                M 412 229 L 360 229 L 360 313 L 452 313
                M 360 271 L 396 271
                M 452 313 L 477 229 L 497 229 L 522 313 L 562 313
                M 466 271 L 508 271
                M 562 229 L 562 313
                M 562 229 L 584 229 A 21 21 0 0 1 584 271 L 562 271
                M 562 271 L 584 271 A 21 21 0 0 1 584 313 L 562 313
                M 342 168 L 238 168 L 197 209 L 197 291 L 238 332 L 264 306
            "/>
            <circle cx="238" cy="168" r="15" fill="#00d4f5" stroke="none"/>
            <circle cx="238" cy="332" r="15" fill="#00d4f5" stroke="none"/>
        </g>
    </g>

    <!-- === CAPA 2: Borde cian nítido === -->
    <g filter="url(#neon-inner)">
        <g stroke="#40e0f8" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="
                M 310 245 A 42 42 0 1 0 310 297 L 310 271 L 278 271
                M 310 271 L 362 271
                M 412 229 L 360 229 L 360 313 L 452 313
                M 360 271 L 396 271
                M 452 313 L 477 229 L 497 229 L 522 313 L 562 313
                M 466 271 L 508 271
                M 562 229 L 562 313
                M 562 229 L 584 229 A 21 21 0 0 1 584 271 L 562 271
                M 562 271 L 584 271 A 21 21 0 0 1 584 313 L 562 313
                M 342 168 L 238 168 L 197 209 L 197 291 L 238 332 L 264 306
            "/>
        </g>
        <!-- Nodos con relleno cian -->
        <circle cx="238" cy="168" r="15" fill="#30c8f0" stroke="#60e8ff" stroke-width="2"/>
        <circle cx="238" cy="332" r="15" fill="#30c8f0" stroke="#60e8ff" stroke-width="2"/>
    </g>

    <!-- === CAPA 3: Relleno oscuro (interior de los trazos) === -->
    <g stroke="url(#glassGrad)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="
            M 310 245 A 42 42 0 1 0 310 297 L 310 271 L 278 271
            M 310 271 L 362 271
            M 412 229 L 360 229 L 360 313 L 452 313
            M 360 271 L 396 271
            M 452 313 L 477 229 L 497 229 L 522 313 L 562 313
            M 466 271 L 508 271
            M 562 229 L 562 313
            M 562 229 L 584 229 A 21 21 0 0 1 584 271 L 562 271
            M 562 271 L 584 271 A 21 21 0 0 1 584 313 L 562 313
            M 342 168 L 238 168 L 197 209 L 197 291 L 238 332 L 264 306
        "/>
    </g>

    <!-- === Highlights de núcleo (línea brillante central) === -->
    <g stroke="#a0eeff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
        <path d="
            M 310 245 A 42 42 0 1 0 310 297 L 310 271 L 278 271
            M 310 271 L 362 271
            M 412 229 L 360 229 L 360 313 L 452 313
            M 360 271 L 396 271
            M 452 313 L 477 229 L 497 229 L 522 313 L 562 313
            M 466 271 L 508 271
            M 562 229 L 562 313
            M 562 229 L 584 229 A 21 21 0 0 1 584 271 L 562 271
            M 562 271 L 584 271 A 21 21 0 0 1 584 313 L 562 313
            M 342 168 L 238 168 L 197 209 L 197 291 L 238 332 L 264 306
        "/>
    </g>

    <!-- === Puntos de brillo sobre los nodos === -->
    <circle cx="238" cy="168" r="6" fill="#c8f5ff" filter="url(#glow-small)"/>
    <circle cx="238" cy="332" r="6" fill="#c8f5ff" filter="url(#glow-small)"/>
    <circle cx="342" cy="168" r="5" fill="#c8f5ff" filter="url(#glow-small)"/>

    <!-- === Texto: Semillero de investigacion === -->
    <text x="400" y="365" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="20" font-style="italic"
          fill="#50d8f0" opacity="0.85" filter="url(#neon-inner)">
        Semillero de investigacion
    </text>
    <!-- === Texto: Analitica de datos y Big Data === -->
    <text x="400" y="390" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="20" font-style="italic"
          fill="#50d8f0" opacity="0.85" filter="url(#neon-inner)">
        Analitica de datos y Big Data
    </text>
</svg>